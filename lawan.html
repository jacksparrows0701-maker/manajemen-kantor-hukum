<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Lawan - Manajemen Kantor Hukum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-icon">MK</div><div><div class="brand-text">Manajemen Kantor Hukum</div><div class="brand-sub">Sistem Manajemen</div></div></div>
      <nav>
        <div class="nav-section">Menu</div>
        <a href="index.html" class="nav-item"><span class="icon">&#127968;</span> Beranda</a>
        <a href="lihat-data.html" class="nav-item"><span class="icon">&#128269;</span> Lihat Data</a>
        <div class="nav-section">Input Data</div>
        <a href="klien.html" class="nav-item"><span class="icon">&#128100;</span> Data Klien</a>
        <a href="lawan.html" class="nav-item"><span class="icon">&#9878;</span> Data Lawan</a>
        <a href="kasus.html" class="nav-item"><span class="icon">&#128220;</span> Data Kasus</a>
        <a href="keuangan.html" class="nav-item"><span class="icon">&#128176;</span> Keuangan</a>
        <a href="jadwal.html" class="nav-item"><span class="icon">&#128197;</span> Jadwal</a>
        <a href="dokumen.html" class="nav-item"><span class="icon">&#128196;</span> Dokumen</a>
        <a href="tagihan.html" class="nav-item"><span class="icon">&#128179;</span> Tagihan</a>
        <a href="catatan.html" class="nav-item"><span class="icon">&#128221;</span> Catatan</a>
      </nav>
      <div class="user-box"><span class="uname" id="userName"></span><button class="logout-btn" onclick="logout()">Logout</button></div>
    </aside>
    <div class="overlay" id="overlay"></div>
    <main class="main">
      <div class="mobile-topbar"><button class="hamburger" onclick="toggleSidebar()">&#9776;</button><span class="brand-m">Manajemen Kantor Hukum</span></div>
      <div class="page">
        <h1 class="page-title">Data Lawan</h1>
        <div class="form-container">
          <div class="form-card">
            <div id="errorMsg" class="error-msg"></div>
            <form id="formLawan">
              <div class="form-group">
                <label>ID Klien Terkait <span class="req">*</span></label>
                <div class="ac-wrap"><input type="text" name="idKlien" id="idKlien" placeholder="Klik untuk pilih..." required autocomplete="off"><div class="ac-list" id="acIdKlien"></div></div>
              </div>
              <div class="form-group"><label>Nama Lengkap <span class="req">*</span></label><input type="text" name="nama" required></div>
              <div class="row">
                <div class="form-group"><label>No. KTP</label><input type="text" name="ktp" maxlength="16"></div>
                <div class="form-group"><label>No. HP</label><input type="text" name="hp"></div>
              </div>
              <div class="row">
                <div class="form-group"><label>Nama Ayah <span class="req">*</span></label><input type="text" name="namaAyah" placeholder="Untuk bin/binti" required></div>
                <div class="form-group"><label>Jenis Kelamin <span class="req">*</span></label>
                  <select name="jenisKelamin" required><option value="">-- Pilih --</option><option>Laki-laki</option><option>Perempuan</option></select>
                </div>
              </div>
              <div class="row">
                <div class="form-group"><label>Tempat Lahir</label><input type="text" name="tempatLahir" placeholder="Kota kelahiran"></div>
                <div class="form-group"><label>Tanggal Lahir</label><input type="date" name="tglLahir"></div>
              </div>
              <div class="form-group"><label>Alamat <span class="req">*</span></label><textarea name="alamat" required></textarea></div>
              <div class="row">
                <div class="form-group"><label>Status Perkawinan <span class="req">*</span></label>
                  <select name="statusKawin" required><option value="">-- Pilih --</option><option>Menikah</option><option>Cerai</option><option>Duda/Janda</option><option>Belum Menikah</option></select>
                </div>
                <div class="form-group"><label>Agama</label>
                  <select name="agama"><option value="">-- Pilih --</option><option>Islam</option><option>Kristen</option><option>Katolik</option><option>Hindu</option><option>Buddha</option><option>Konghucu</option></select>
                </div>
              </div>
              <div class="row">
                <div class="form-group"><label>Pekerjaan</label><input type="text" name="pekerjaan" placeholder="Contoh: Karyawan"></div>
                <div class="form-group"><label>Penghasilan/Bulan</label><input type="number" name="penghasilan" placeholder="Rp"></div>
              </div>
              <div class="form-group"><label>Hubungan <span class="req">*</span></label>
                <select name="hubungan" required><option value="">-- Pilih --</option><option>Suami</option><option>Istri</option><option>Anak</option><option>Orang Tua</option><option>Saudara</option><option>Lainnya</option></select>
              </div>
              <div class="form-group"><label>Keterangan</label><textarea name="keterangan"></textarea></div>
              <button type="submit" class="btn" id="btnSubmit">Simpan Data Lawan</button>
            </form>
            <div class="success" id="successMsg"><div class="icon">&#9989;</div><h2>Berhasil Disimpan!</h2><p id="successId">Data lawan berhasil dikirim</p><button class="btn btn-success" onclick="resetForm()">Tambah Lawan Baru</button></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if (localStorage.getItem('adminLogin') !== 'true') { window.location.href = 'index.html'; }
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxAGAUbsmR07AIOlMph13H8AlVoFQJuyCVTasH47uICsP59eP-7AfU_f-q2S3QcSQgW1g/exec';

    document.getElementById('formLawan').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      var form = e.target;
      var data = {
        action: 'addLawan', idKlien: form.idKlien.value, nama: form.nama.value, namaAyah: form.namaAyah.value,
        jenisKelamin: form.jenisKelamin.value, ktp: form.ktp.value, hp: form.hp.value, tempatLahir: form.tempatLahir.value,
        tglLahir: form.tglLahir.value, pekerjaan: form.pekerjaan.value, alamat: form.alamat.value,
        statusKawin: form.statusKawin.value, agama: form.agama.value, penghasilan: form.penghasilan.value || 0,
        hubungan: form.hubungan.value, keterangan: form.keterangan.value
      };
      document.getElementById('formLawan').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Simpan Data Lawan';
      new Image().src = WEB_APP_URL + '?action=addLawan&data=' + encodeURIComponent(JSON.stringify(data));
    });

    function resetForm() {
      document.getElementById('formLawan').reset();
      document.getElementById('formLawan').style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function initAc(inputId, listId, sheetName, idKey, nameKey) {
      var input = document.getElementById(inputId);
      var list = document.getElementById(listId);
      var data = [];
      function showDropdown() {
        var val = input.value.toLowerCase();
        list.innerHTML = '';
        var filtered = data.filter(function(r) {
          return String(r[idKey]).toLowerCase().indexOf(val) > -1 || String(r[nameKey]).toLowerCase().indexOf(val) > -1;
        }).slice(0, 10);
        filtered.forEach(function(r) {
          var div = document.createElement('div');
          div.className = 'ac-item';
          div.innerHTML = '<span class="ac-id">' + r[idKey] + '</span><span class="ac-name">' + r[nameKey] + '</span>';
          div.addEventListener('mousedown', function(e) { e.preventDefault(); input.value = r[idKey]; list.classList.remove('show'); });
          list.appendChild(div);
        });
        list.classList.toggle('show', filtered.length > 0);
      }
      input.addEventListener('focus', function() {
        if (data.length === 0) {
          fetch(WEB_APP_URL + '?action=getData&sheet=' + encodeURIComponent(sheetName))
            .then(function(r) { return r.json(); })
            .then(function(res) { if (res.data) { data = res.data; showDropdown(); } });
        } else { showDropdown(); }
      });
      input.addEventListener('input', function() { showDropdown(); });
      input.addEventListener('blur', function() { setTimeout(function() { list.classList.remove('show'); }, 200); });
    }
    initAc('idKlien', 'acIdKlien', 'Data Klien', 'ID', 'Nama');
  </script>
</body>
</html>
