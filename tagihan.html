<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tagihan - Manajemen Kantor Hukum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-icon">MK</div><div><div class="brand-text">Manajemen Kantor Hukum</div><div class="brand-sub">Sistem Manajemen</div></div></div>
      <nav>
        <div class="nav-section">Menu</div>
        <a href="index.html" class="nav-item"><span class="icon">&#127968;</span> Beranda</a>
        <a href="lihat-data.html" class="nav-item"><span class="icon">&#128269;</span> Lihat Data</a>
        <div class="nav-section">Input Data</div>
        <a href="klien.html" class="nav-item"><span class="icon">&#128100;</span> Data Klien</a>
        <a href="lawan.html" class="nav-item"><span class="icon">&#9878;</span> Data Lawan</a>
        <a href="kasus.html" class="nav-item"><span class="icon">&#128220;</span> Data Kasus</a>
        <a href="keuangan.html" class="nav-item"><span class="icon">&#128176;</span> Keuangan</a>
        <a href="jadwal.html" class="nav-item"><span class="icon">&#128197;</span> Jadwal</a>
        <a href="dokumen.html" class="nav-item"><span class="icon">&#128196;</span> Dokumen</a>
        <a href="tagihan.html" class="nav-item"><span class="icon">&#128179;</span> Tagihan</a>
        <a href="catatan.html" class="nav-item"><span class="icon">&#128221;</span> Catatan</a>
      </nav>
      <div class="user-box"><span class="uname" id="userName"></span><button class="logout-btn" onclick="logout()">Logout</button></div>
    </aside>
    <div class="overlay" id="overlay"></div>
    <main class="main">
      <div class="mobile-topbar"><button class="hamburger" onclick="toggleSidebar()">&#9776;</button><span class="brand-m">Manajemen Kantor Hukum</span></div>
      <div class="page">
        <h1 class="page-title">Buat Tagihan / Invoice</h1>
        <div class="form-container">
          <div class="form-card">
            <div id="errorMsg" class="error-msg"></div>
            <form id="formTagihan">
              <div class="form-group">
                <label>ID Kasus <span class="req">*</span></label>
                <div class="ac-wrap"><input type="text" name="idKasus" id="idKasus" placeholder="Klik untuk pilih..." required autocomplete="off"><div class="ac-list" id="acIdKasus"></div></div>
              </div>
              <div class="row">
                <div class="form-group"><label>No. Invoice <span class="req">*</span></label><input type="text" name="noInvoice" placeholder="INV-001" required></div>
                <div class="form-group"><label>Jumlah <span class="req">*</span></label><input type="number" name="jumlah" placeholder="Rp" required></div>
              </div>
              <div class="form-group"><label>Item Tagihan <span class="req">*</span></label><input type="text" name="item" placeholder="Contoh: Biaya konsultasi tahap 1" required></div>
              <div class="row">
                <div class="form-group"><label>Status Bayar <span class="req">*</span></label>
                  <select name="statusBayar" required><option value="">-- Pilih --</option><option>Belum Bayar</option><option>DP Terbayar</option><option>Lunas</option><option>Terlambat</option></select>
                </div>
                <div class="form-group"><label>Jatuh Tempo <span class="req">*</span></label><input type="date" name="jatuhTempo" required></div>
              </div>
              <div class="form-group"><label>Tanggal Bayar</label><input type="date" name="tglBayar"></div>
              <div class="form-group"><label>Keterangan</label><textarea name="keterangan"></textarea></div>
              <button type="submit" class="btn" id="btnSubmit">Simpan Tagihan</button>
            </form>
            <div class="success" id="successMsg"><div class="icon">&#9989;</div><h2>Berhasil Disimpan!</h2><p>Tagihan berhasil dicatat</p><button class="btn btn-success" onclick="resetForm()">Buat Tagihan Baru</button></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if (localStorage.getItem('adminLogin') !== 'true') { window.location.href = 'index.html'; }
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxAGAUbsmR07AIOlMph13H8AlVoFQJuyCVTasH47uICsP59eP-7AfU_f-q2S3QcSQgW1g/exec';

    document.getElementById('formTagihan').addEventListener('submit', function(e) {
      e.preventDefault();
      var btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Menyimpan...';
      var form = e.target;
      var data = {
        action: 'addTagihan', idKasus: form.idKasus.value, noInvoice: form.noInvoice.value, item: form.item.value,
        jumlah: form.jumlah.value, statusBayar: form.statusBayar.value, jatuhTempo: form.jatuhTempo.value,
        tglBayar: form.tglBayar.value, keterangan: form.keterangan.value
      };
      document.getElementById('formTagihan').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Simpan Tagihan';
      new Image().src = WEB_APP_URL + '?action=addTagihan&data=' + encodeURIComponent(JSON.stringify(data));
    });

    function resetForm() {
      document.getElementById('formTagihan').reset();
      document.getElementById('formTagihan').style.display = 'block';
      document.getElementById('successMsg').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'none';
    }

    function initAc(inputId, listId, sheetName, idKey, nameKey) {
      var input = document.getElementById(inputId);
      var list = document.getElementById(listId);
      var data = [];
      function showDropdown() {
        var val = input.value.toLowerCase();
        list.innerHTML = '';
        var filtered = data.filter(function(r) {
          return String(r[idKey]).toLowerCase().indexOf(val) > -1 || String(r[nameKey]).toLowerCase().indexOf(val) > -1;
        }).slice(0, 10);
        filtered.forEach(function(r) {
          var div = document.createElement('div');
          div.className = 'ac-item';
          div.innerHTML = '<span class="ac-id">' + r[idKey] + '</span><span class="ac-name">' + r[nameKey] + '</span>';
          div.addEventListener('mousedown', function(e) { e.preventDefault(); input.value = r[idKey]; list.classList.remove('show'); });
          list.appendChild(div);
        });
        list.classList.toggle('show', filtered.length > 0);
      }
      input.addEventListener('focus', function() {
        if (data.length === 0) {
          fetch(WEB_APP_URL + '?action=getData&sheet=' + encodeURIComponent(sheetName))
            .then(function(r) { return r.json(); })
            .then(function(res) { if (res.data) { data = res.data; showDropdown(); } });
        } else { showDropdown(); }
      });
      input.addEventListener('input', function() { showDropdown(); });
      input.addEventListener('blur', function() { setTimeout(function() { list.classList.remove('show'); }, 200); });
    }
    initAc('idKasus', 'acIdKasus', 'Data Kasus', 'ID', 'No Perkara');
  </script>
</body>
</html>
