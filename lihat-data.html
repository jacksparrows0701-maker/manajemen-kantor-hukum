<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lihat Data - Manajemen Kantor Hukum</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f4f8; min-height: 100vh; }
    .header { background: linear-gradient(135deg, #1a5276, #2980b9); color: white; padding: 20px; }
    .header a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 13px; }
    .header h1 { font-size: 20px; }
    .container { max-width: 1000px; margin: 20px auto; padding: 0 16px; }
    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .sum-card { background: white; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-top: 4px solid #2980b9; }
    .sum-card .num { font-size: 26px; font-weight: 700; color: #1a5276; }
    .sum-card .lbl { font-size: 12px; color: #666; margin-top: 4px; }
    .sum-card.red { border-top-color: #e74c3c; }
    .sum-card.green { border-top-color: #27ae60; }
    .panel { background: white; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab { padding: 8px 18px; border-radius: 20px; border: 1.5px solid #2980b9; background: white; color: #2980b9; font-weight: 600; font-size: 13px; cursor: pointer; }
    .tab.active { background: #2980b9; color: white; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar input, .toolbar select { padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 13px; }
    .toolbar input { flex: 1; min-width: 180px; }
    .toolbar input:focus, .toolbar select:focus { border-color: #2980b9; outline: none; }
    .toolbar .tab { background: white; }
    .toolbar .tab:hover { background: #eaf2f8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: #1a5276; color: white; text-align: left; padding: 9px 10px; white-space: nowrap; position: sticky; top: 0; }
    td { padding: 9px 10px; border-bottom: 1px solid #eee; vertical-align: top; }
    tr:hover td { background: #eaf2f8; }
    .table-wrap { overflow-x: auto; max-height: 480px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .badge.today { background: #fdecea; color: #e74c3c; }
    .badge.tomorrow { background: #fef9e7; color: #f39c12; }
    .badge.soon { background: #eafaf1; color: #27ae60; }
    .badge.status { background: #eef2f7; color: #34495e; }
    .empty { text-align: center; padding: 40px; color: #888; font-size: 14px; }
    .loading { text-align: center; padding: 40px; color: #888; }
    .err { background: #fdecea; color: #e74c3c; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
    @media (max-width: 500px) { .summary { grid-template-columns: 1fr 1fr; } th { font-size: 12px; } td { font-size: 12px; } }
  </style>
</head>
<body>
  <div class="header">
    <a href="index.html">&larr; Kembali</a>
    <h1>Lihat Data</h1>
  </div>

  <div class="container">
    <div id="errorMsg" class="err"></div>

    <div class="summary">
      <div class="sum-card"><div class="num" id="sumKlien">-</div><div class="lbl">Total Klien</div></div>
      <div class="sum-card"><div class="num" id="sumKasus">-</div><div class="lbl">Total Kasus</div></div>
      <div class="sum-card green"><div class="num" id="sumBulan">-</div><div class="lbl">Jadwal Bulan Ini</div></div>
      <div class="sum-card red"><div class="num" id="sumHari">-</div><div class="lbl">Jadwal Hari Ini</div></div>
    </div>

    <div class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="klien">Data Klien</button>
        <button class="tab" data-tab="kasus">Data Kasus</button>
        <button class="tab" data-tab="jadwal">Jadwal</button>
      </div>

      <div class="toolbar">
        <input type="text" id="searchBox" placeholder="Cari...">
        <select id="filterJadwal" style="display:none;">
          <option value="">Semua tipe</option>
          <option>Sidang</option>
          <option>Konsultasi</option>
          <option>Mediasi</option>
          <option>Meeting</option>
          <option>Lainnya</option>
        </select>
        <button class="tab" id="btnRefresh" style="border-color:#27ae60;color:#27ae60;">Muat Ulang</button>
      </div>

      <div id="loadingMsg" class="loading">Memuat data...</div>
      <div class="table-wrap" id="tableWrap" style="display:none;">
        <table>
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyMsg" style="display:none;">Tidak ada data.</div>
    </div>
  </div>

  <script>
    if (localStorage.getItem('adminLogin') !== 'true') { window.location.href = 'index.html'; }
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxAGAUbsmR07AIOlMph13H8AlVoFQJuyCVTasH47uICsP59eP-7AfU_f-q2S3QcSQgW1g/exec';

    var state = { klien: [], kasus: [], jadwal: [], tab: 'klien', search: '', filterJadwal: '' };

    var COLUMNS = {
      klien: [
        { key: 'ID', label: 'ID' },
        { key: 'Nama', label: 'Nama' },
        { key: 'NoHP', label: 'No HP' },
        { key: 'TglDaftar', label: 'Tgl Daftar' },
        { key: 'Keterangan', label: 'Keterangan' }
      ],
      kasus: [
        { key: 'ID', label: 'ID' },
        { key: 'NamaKlien', label: 'Klien' },
        { key: 'TipeKasus', label: 'Tipe Kasus' },
        { key: 'StatusKasus', label: 'Status Kasus' },
        { key: 'NoPerkara', label: 'No Perkara' },
        { key: 'StatusPerkara', label: 'Status Perkara' },
        { key: 'TglDaftar', label: 'Tgl Daftar' }
      ],
      jadwal: [
        { key: 'Tanggal', label: 'Tanggal' },
        { key: 'Waktu', label: 'Waktu' },
        { key: 'TipeJadwal', label: 'Tipe' },
        { key: 'NamaKlien', label: 'Klien' },
        { key: 'TipeKasus', label: 'Kasus' },
        { key: 'NoPerkara', label: 'No Perkara' },
        { key: 'Lokasi', label: 'Lokasi' },
        { key: 'Status', label: 'Status' }
      ]
    };

    function fmtTanggal(v) {
      if (!v) return '-';
      var d = new Date(v);
      if (isNaN(d.getTime())) return String(v);
      return d.getDate() + ' ' + ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][d.getMonth()] + ' ' + d.getFullYear();
    }

    function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

    function formatTanggalBeda(v) {
      if (!v) return 'soon';
      var d = startOfDay(new Date(v));
      if (isNaN(d.getTime())) return 'soon';
      var today = startOfDay(new Date());
      var diff = Math.round((d - today) / (1000 * 60 * 60 * 24));
      if (diff === 0) return 'today';
      if (diff === 1) return 'tomorrow';
      return 'soon';
    }

    function labelTanggalBeda(v) {
      var k = formatTanggalBeda(v);
      if (k === 'today') return '<span class="badge today">Hari Ini</span>';
      if (k === 'tomorrow') return '<span class="badge tomorrow">Besok</span>';
      return '';
    }

    function load() {
      document.getElementById('loadingMsg').style.display = 'block';
      document.getElementById('tableWrap').style.display = 'none';
      document.getElementById('emptyMsg').style.display = 'none';
      fetch(WEB_APP_URL + '?action=getRekap&t=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (!res || res.success === false) throw new Error((res && res.message) || 'Gagal memuat data');
          state.klien = res.klien || [];
          state.kasus = res.kasus || [];
          state.jadwal = res.jadwal || [];
          render();
        })
        .catch(function(err) {
          document.getElementById('loadingMsg').style.display = 'none';
          var em = document.getElementById('errorMsg');
          em.textContent = 'Gagal memuat data: ' + err.message;
          em.style.display = 'block';
        });
    }

    function render() {
      document.getElementById('loadingMsg').style.display = 'none';
      var sumKlien = document.getElementById('sumKlien');
      var sumKasus = document.getElementById('sumKasus');
      var now = new Date();
      var bulanIni = now.getMonth();
      var tahunIni = now.getFullYear();
      var jadwalBulan = state.jadwal.filter(function(j) {
        var d = new Date(j.Tanggal);
        return !isNaN(d.getTime()) && d.getMonth() === bulanIni && d.getFullYear() === tahunIni;
      }).length;
      var jadwalHari = state.jadwal.filter(function(j) {
        return formatTanggalBeda(j.Tanggal) === 'today';
      }).length;
      sumKlien.textContent = state.klien.length;
      sumKasus.textContent = state.kasus.length;
      document.getElementById('sumBulan').textContent = jadwalBulan;
      document.getElementById('sumHari').textContent = jadwalHari;

      document.getElementById('filterJadwal').style.display = state.tab === 'jadwal' ? 'block' : 'none';
      document.getElementById('searchBox').placeholder = state.tab === 'jadwal' ? 'Cari klien, kasus, lokasi...' : 'Cari...';

      var rows;
      if (state.tab === 'klien') {
        rows = state.klien;
      } else if (state.tab === 'kasus') {
        rows = state.kasus;
      } else {
        rows = state.jadwal.filter(function(j) {
          return !state.filterJadwal || j.TipeJadwal === state.filterJadwal;
        });
      }

      var q = state.search.trim().toLowerCase();
      if (q) {
        rows = rows.filter(function(r) {
          return Object.keys(r).some(function(k) {
            return String(r[k] == null ? '' : r[k]).toLowerCase().indexOf(q) > -1;
          });
        });
      }

      var cols = COLUMNS[state.tab];
      var head = '<tr>';
      for (var c = 0; c < cols.length; c++) { head += '<th>' + cols[c].label + '</th>'; }
      head += '</tr>';
      document.getElementById('tableHead').innerHTML = head;

      var body = '';
      for (var i = 0; i < rows.length; i++) {
        body += '<tr>';
        for (var c = 0; c < cols.length; c++) {
          var v = rows[i][cols[c].key];
          var val = v == null || v === '' ? '-' : String(v);
          if (cols[c].key === 'Tanggal' || cols[c].key === 'TglDaftar' || cols[c].key === 'JatuhTempo') {
            val = fmtTanggal(v);
          }
          if (cols[c].key === 'Tanggal') { val += ' ' + labelTanggalBeda(v); }
          if (cols[c].key === 'Status') { val = '<span class="badge status">' + val + '</span>'; }
          body += '<td>' + val + '</td>';
        }
        body += '</tr>';
      }

      document.getElementById('tableBody').innerHTML = body;
      var tw = document.getElementById('tableWrap');
      var empty = document.getElementById('emptyMsg');
      if (rows.length === 0) {
        tw.style.display = 'none';
        empty.style.display = 'block';
        empty.textContent = 'Tidak ada data' + (q ? ' untuk pencarian "' + state.search + '"' : '') + '.';
      } else {
        tw.style.display = 'block';
        empty.style.display = 'none';
      }
    }

    Array.prototype.forEach.call(document.querySelectorAll('.tab[data-tab]'), function(btn) {
      btn.addEventListener('click', function() {
        Array.prototype.forEach.call(document.querySelectorAll('.tab[data-tab]'), function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        state.tab = btn.getAttribute('data-tab');
        state.search = '';
        document.getElementById('searchBox').value = '';
        state.filterJadwal = '';
        document.getElementById('filterJadwal').value = '';
        render();
      });
    });

    document.getElementById('searchBox').addEventListener('input', function() {
      state.search = this.value;
      render();
    });

    document.getElementById('filterJadwal').addEventListener('change', function() {
      state.filterJadwal = this.value;
      render();
    });

    document.getElementById('btnRefresh').addEventListener('click', function() {
      document.getElementById('errorMsg').style.display = 'none';
      load();
    });

    load();
  </script>
</body>
</html>
