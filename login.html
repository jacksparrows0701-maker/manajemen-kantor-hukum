<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Manajemen Kantor Hukum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-brand">
        <div class="brand-icon" style="width:40px;height:40px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;">MK</div>
      </div>
      <h1>Manajemen Kantor Hukum</h1>
      <div class="subtitle">Masuk ke sistem manajemen</div>
      <div class="error-msg" id="loginError"></div>
      <form id="loginForm" onsubmit="doLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Masukkan username" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Masukkan password" required>
        </div>
        <button type="submit" class="btn" id="btnLogin">Login</button>
      </form>
      <div style="text-align:center;margin-top:16px;">
        <a href="#" onclick="showChangePassword()" style="font-size:13px;">Ganti Password</a>
      </div>
    </div>
  </div>

  <div class="overlay" id="cpModal" style="display:none;">
    <div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;">
      <div class="login-box" style="max-width:380px;position:relative;">
        <button onclick="hideChangePassword()" style="position:absolute;top:12px;right:16px;background:none;border:none;font-size:20px;color:var(--text-secondary);cursor:pointer;">&times;</button>
        <h1 style="font-size:18px;margin-bottom:4px;">Ganti Password</h1>
        <div class="subtitle">Masukkan data Anda</div>
        <div class="error-msg" id="cpError"></div>
        <div style="background:var(--green-soft);color:var(--green);padding:10px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;text-align:center;" id="cpSuccess"></div>
        <form id="cpForm" onsubmit="doChangePassword(event)">
          <div class="form-group">
            <label>Username</label>
            <input type="text" id="cpUsername" placeholder="Masukkan username" required>
          </div>
          <div class="form-group">
            <label>Password Lama</label>
            <input type="password" id="cpOldPassword" placeholder="Masukkan password lama" required>
          </div>
          <div class="form-group">
            <label>Password Baru</label>
            <input type="password" id="cpNewPassword" placeholder="Masukkan password baru" required>
          </div>
          <button type="submit" class="btn" id="btnCP">Ganti Password</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxAGAUbsmR07AIOlMph13H8AlVoFQJuyCVTasH47uICsP59eP-7AfU_f-q2S3QcSQgW1g/exec';

    if (localStorage.getItem('adminLogin') === 'true') {
      window.location.href = 'index.html';
    }

    function doLogin(e) {
      e.preventDefault();
      var btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Memproses...';
      document.getElementById('loginError').style.display = 'none';

      fetch(WEB_APP_URL + '?action=login&username=' + encodeURIComponent(document.getElementById('username').value) + '&password=' + encodeURIComponent(document.getElementById('password').value))
      .then(function(r) { return r.json(); }).then(function(res) {
        if (res.success) {
          localStorage.setItem('adminLogin', 'true');
          localStorage.setItem('adminName', res.nama);
          localStorage.setItem('adminRole', res.role);
          window.location.href = 'index.html';
        } else {
          document.getElementById('loginError').textContent = res.message;
          document.getElementById('loginError').style.display = 'block';
        }
        btn.disabled = false;
        btn.textContent = 'Login';
      }).catch(function() {
        document.getElementById('loginError').textContent = 'Gagal menghubungi server';
        document.getElementById('loginError').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
      });
    }

    function showChangePassword() {
      document.getElementById('cpModal').style.display = 'block';
      document.getElementById('cpError').style.display = 'none';
      document.getElementById('cpSuccess').style.display = 'none';
    }
    function hideChangePassword() {
      document.getElementById('cpModal').style.display = 'none';
    }

    function doChangePassword(e) {
      e.preventDefault();
      var btn = document.getElementById('btnCP');
      btn.disabled = true;
      btn.textContent = 'Memproses...';
      document.getElementById('cpError').style.display = 'none';
      document.getElementById('cpSuccess').style.display = 'none';

      fetch(WEB_APP_URL + '?action=changePassword&username=' + encodeURIComponent(document.getElementById('cpUsername').value) + '&oldPassword=' + encodeURIComponent(document.getElementById('cpOldPassword').value) + '&newPassword=' + encodeURIComponent(document.getElementById('cpNewPassword').value))
      .then(function(r) { return r.json(); }).then(function(res) {
        if (res.success) {
          document.getElementById('cpSuccess').textContent = 'Password berhasil diganti!';
          document.getElementById('cpSuccess').style.display = 'block';
          document.getElementById('cpForm').reset();
        } else {
          document.getElementById('cpError').textContent = res.message;
          document.getElementById('cpError').style.display = 'block';
        }
        btn.disabled = false;
        btn.textContent = 'Ganti Password';
      }).catch(function() {
        document.getElementById('cpError').textContent = 'Gagal menghubungi server';
        document.getElementById('cpError').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Ganti Password';
      });
    }
  </script>
</body>
</html>
